<!DOCTYPE html>
<html lang="ru"> 
  <head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Аудио воспроизводитель">
    <meta property="og:description" content="Бесплатный сайт с готовой музыкой, звуками">
    <meta property="og:image" content="assets/favicon.ico">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <title>
      Аудио воспроизводитель
    </title>
    <style>
      :root {
        --columns: 1fr;
        --gap: 16px;
      }

      @media (min-width: 750px) {
        :root {
          --columns: 1fr 1fr 1fr;
          --gap: 16px;
        }
      }
    </style>
  </head>
  <body style="
    background: #111111;
    color: #ffffff;
    font-family: system-ui;
    padding: 16px;
  ">
    <img src="assets/IMG_20260521_230216.png" style="
      width: 100%;
      height: auto;
    " alt="Изображение">
    <div style="text-align: center;">
      <a href="https://shiftlytm.github.io/audio-player/subpage(s)/cabinet.html">
        <button style="
          background: #ffffff;
          color: #111111;
          border-radius: 100px;
          padding: 16px;
          margin: 16px;
        ">
          Войти в кабинет
        </button>
      </a>
    </div>
    <hr style="border: none;">
    <div style="
      display: grid;
      grid-template-columns: var(--columns);
      gap: var(--gap);
    ">
      <div style="
        border-radius: 16px;
        background: #212121;
        padding: 16px;
      ">
        <h1>
          Песни
        </h1>
      </div>
      <div style="
        border-radius: 16px;
        background: #212121;
        padding: 16px;
      ">
        <h1>
          Музыка
        </h1>
      </div>
      <div style="
        border-radius: 16px;
        background: #212121;
        padding: 16px;
      ">
        <h1>
          Звуки
        </h1>
      </div>
    </div>
  </body>
</html>
